name = "nivis"
description = "A clean zola theme for bloggers"
tags = ["Clean", "Blog", "Responsive"]
license = "MIT"
homepage = "https://github.com/Resorie/zola-theme-nivis"
demo = "https://resorie.xyz/blog/"
# The minimum version of Zola required
min_version = "0.23.4"

# Any variable there can be overriden in the end user `config.toml`
# You don't need to prefix variables by the theme name but as this will
# be merged with user data, some kind of prefix or nesting is preferable
# Use snake_casing to be consistent with the rest of Zola
[extra]
main_section = "posts"
home_layout = "focus"
# "tags" (default), "category", or "none"
taxonomy_mode = "tags"
motto_mode = "hide"
home_greeting = false
home_recent_posts = 0

[extra.footer]
# Leave this blank to hide the copyright line.
copyright_holder = ""
# Set a start year to render a range ending in the current build year.
copyright_since = 0

[extra.sections]
posts = true
about = true
archive = true
tags = true
links = true

# The theme author info: you!
[author]
name = "Resory"
homepage = "https://resorie.xyz/blog/"
