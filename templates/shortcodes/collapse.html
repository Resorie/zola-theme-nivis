{% component collapse(summary="Details", unfold=false) %}
<details class="collapse-block" {% if unfold %}open{% endif %}>
  <summary class="collapse-summary">
    <span class="collapse-title">{{ summary }}</span>
    <span class="collapse-icon"></span>
  </summary>
  <div class="collapse-content">{{ body | markdown | safe }}</div>
</details>
{% endcomponent collapse %}
