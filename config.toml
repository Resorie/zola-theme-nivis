# The URL the site will be built for
base_url = "https://resorie.xyz/zola-theme-nivis"

# The site title and description; used in feeds by default.
title = "Nivis"
description = "A clean zola theme for bloggers"

# Zola's site language. Use extra.content_lang for article-only language markup.
default_language = "en"

# When set to "true", a feed is automatically generated.
generate_feeds = true

# The filename to use for the feed. Used as the template filename, too.
# Defaults to "atom.xml", which has a builtin template that renders an Atom 1.0 feed.
# There is also a builtin template "rss.xml" that renders an RSS 2.0 feed.
# feed_filename = "atom.xml"

# The taxonomies to be rendered for the site and their configuration.
# Example:
#     taxonomies = [
#       {name = "tags", feed = true}, # each tag will have its own feed
#       {name = "tags", lang = "fr"}, # you can have taxonomies with the same name in multiple languages
#       {name = "categories", paginate_by = 5},  # 5 items per page for a term
#       {name = "authors"}, # Basic definition: no feed or pagination
#     ]
#
taxonomies = [{ name = "tags", paginate_by = 5 }]

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Enable the native search index and Nivis search interface.
build_search_index = false

# You can put any kind of data here. The data
# will be accessible in all templates
# Example:
#     [extra]
#     author = "Famous author"
#
# author value will be available using {{ config.extra.author }} in templates
#

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
# Leave truncate_content_length unset to retain the full indexed body text.

[markdown]
render_emoji = true
github_alerts = true
bottom_footnotes = true

[markdown.highlighting]
style = "class"
light_theme = "one-light"
dark_theme = "one-dark-pro"
extra_grammars = [ "syntaxes/math-display.json" ]

[extra]
main_section = "posts"
math_display = "mathjax"
avatar = ""

# Homepage layout: "focus" (default) or "horizontal"
home_layout = "focus"
# Taxonomy display: "tags" (default), "category", or "none"
taxonomy_mode = "tags"
# Empty inherits Zola's page language. Use "zh-CN" for Chinese articles.
# An individual post can override this through its own extra.content_lang.
content_lang = ""
motto_mode = "multi"
home_recent_posts = 3

mottos = [
    "Code is poetry",
    "Simplicity is the ultimate sophistication",
    "Stay hungry, stay foolish",
]

social_links = [
    { name = "github", url = "https://github.com/Resorie/zola-theme-nivis" }
]

[extra.footer]
# Leave this blank to hide the copyright line.
copyright_holder = ""
# Set a start year to render a range ending in the current build year.
copyright_since = 0

[extra.sections]
posts = true
about = true
archive = true
tags = true
links = true
